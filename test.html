<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>チャネル管理＆投稿</title>
    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            font-family: sans-serif;
        }

        body {
            display: flex;
        }

        #sidebar {
            width: 140px;
            background: #2c3e50;
            color: white;
            display: flex;
            flex-direction: column;
        }

        #sidebar h2 {
            margin: 0;
            padding: 15px 0;
            text-align: center;
            background: #34495e;
        }

        #sidebar ul {
            list-style: none;
            margin: 0;
            padding: 0;
        }

        #sidebar li {
            padding: 15px 10px;
            text-align: center;
            cursor: pointer;
            border-bottom: 1px solid #3d566e;
        }

        #sidebar li:hover,
        #sidebar li.selected {
            background: #1abc9c;
        }

        #main {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        #header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            background: #ecf0f1;
            border-bottom: 1px solid #ccc;
            gap: 20px;
        }

        #channelSearch {
            width: 300px;
            padding: 6px 10px;
            font-size: 16px;
            border-radius: 4px;
            border: 1px solid #ccc;
        }

        #toggleItemListBtn {
            background: linear-gradient(45deg, #1abc9c, #16a085);
            color: white;
            border: none;
            padding: 10px 20px;
            font-weight: 600;
            font-size: 16px;
            border-radius: 30px;
            cursor: pointer;
            transition: background 0.3s ease;
            margin-right: 20px;
        }

        #toggleItemListBtn:hover {
            background: linear-gradient(45deg, #16a085, #1abc9c);
        }

        #toggleItemListBtn:active {
            background: #149174;
            transform: translateY(2px);
        }

        #itemListContainer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: #f7f9fa;
            border-bottom: 1px solid #ddd;
            flex-shrink: 0;
        }

        #itemList {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .channel-btn {
            padding: 8px 16px;
            border: 1px solid #ccc;
            border-radius: 20px;
            background: #ecf0f1;
            cursor: pointer;
            font-weight: 600;
        }

        .channel-btn:hover {
            background: #d0d7db;
        }

        .channel-btn.selected {
            background: #1abc9c;
            color: white;
            border-color: #16a085;
        }

        #itemControls button {
            margin-left: 10px;
            padding: 8px 12px;
            font-size: 14px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        #addChannelBtn {
            background: #2ecc71;
            color: white;
        }

        #deleteChannelBtn {
            background: #e74c3c;
            color: white;
        }

        #deleteChannelBtn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        #postArea {
            display: none;
            flex-direction: column;
            flex: 1;
            min-height: 0;
        }

        #postArea.active {
            display: flex;
        }

        #userInfoHeader {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        #userIconHeader {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
        }

        #userNameHeader {
            font-size: 16px;
            font-weight: bold;
            color: #2c3e50;
        }

        #headerControls {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        #channelSearch {
            width: 200px;
            padding: 6px 10px;
            font-size: 16px;
            border-radius: 4px;
            border: 1px solid #ccc;
        }


        #timeline {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #f4f6f8;
            min-height: 0;
        }

        .postItem {
            background: #fff;
            border: 1px solid #ccc;
            border-radius: 8px;
            padding: 12px 16px;
            margin-bottom: 10px;
        }

        .postItem .meta {
            font-size: 12px;
            color: #888;
            margin-bottom: 6px;
        }

        .postItem .content {
            font-size: 15px;
            white-space: pre-wrap;
        }

        #postTitle {
            margin: 0 20px 10px;
        }

        #postText {
            margin: 0 20px;
            height: 80px;
            resize: none;
            font-size: 16px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        #postBtn {
            margin: 12px 20px 20px auto;
            width: 120px;
            font-size: 16px;
            background: #1abc9c;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
            align-self: flex-end;
        }
    </style>
</head>

<body>
    <div id="sidebar">
        <h2>メニュー</h2>
        <ul>
            <li data-key="channel" class="selected">ホーム</li>
            <li data-key="follow">フォロー一覧</li>
            <li data-key="dm">DM</li>
            <li data-key="setting">設定</li>
            <li data-key="log out">ログアウト</li>


        </ul>
    </div>

    <div id="main">
        <div id="header">
            <div id="userInfo">
                <img id="userIcon" src="https://via.placeholder.com/40" alt="ユーザーアイコン" />
                <span id="userName">太郎さん</span>
            </div>
            <button id="toggleItemListBtn">チャネル一覧</button>
            <input type="text" id="channelSearch" placeholder="チャネル検索" />
        </div>

        <div id="itemListContainer">
            <div id="itemList"></div>
            <div id="itemControls">
                <button id="favoriteFilterBtn">★ お気に入りのみ表示</button>
                <button id="addChannelBtn">＋ チャネル追加</button>
                <button id="deleteChannelBtn" disabled>🗑 選択削除</button>
            </div>
        </div>

        <div id="postArea">

            <div id="timeline"></div>
            <h3 id="postTitle">投稿画面</h3>
            <textarea id="postText" placeholder="ここに投稿内容を入力"></textarea>
            <button id="postBtn">投稿する</button>
        </div>


    </div>

    <script>
        const sidebarItems = document.querySelectorAll('#sidebar li');
        const channelSearch = document.getElementById('channelSearch');
        const itemList = document.getElementById('itemList');
        const postArea = document.getElementById('postArea');
        const postTitle = document.getElementById('postTitle');
        const postText = document.getElementById('postText');
        const postBtn = document.getElementById('postBtn');
        const addChannelBtn = document.getElementById('addChannelBtn');
        const deleteChannelBtn = document.getElementById('deleteChannelBtn');
        const toggleItemListBtn = document.getElementById('toggleItemListBtn');
        const itemListContainer = document.getElementById('itemListContainer');
        const timeline = document.getElementById('timeline');

        let selectedMainKey = 'channel';
        let selectedItem = null;
        let channelItems = ['全体', 'クラス', '教員', '趣味'];


        let favoriteChannels = new Set();
        let showFavoritesOnly = false;

        // 投稿データをチャネルごとに保存
        // 各投稿は { user: {name, icon}, text, timestamp } の形で格納
        const postsData = {};
        channelItems.forEach(ch => {
            postsData[ch] = [];
        });

        // サンプルで他のユーザーの投稿を追加（「全体」チャネル）
        postsData['全体'].push(
            {
                user: { name: '花子さん', icon: 'https://i.pravatar.cc/40?img=1' },
                text: 'こんにちは、花子です！',
                timestamp: new Date(Date.now() - 1000 * 60 * 60),
            },
            {
                user: { name: '次郎さん', icon: 'https://i.pravatar.cc/40?img=2' },
                text: '太郎さん、元気？',
                timestamp: new Date(Date.now() - 1000 * 60 * 30),
            }
        );

        // 太郎さんのアイコンと名前（投稿時に使う）
        const currentUser = { name: '太郎さん', icon: 'https://via.placeholder.com/40' };

        function selectMainKey(key) {
            selectedMainKey = key;
            sidebarItems.forEach(li => li.classList.toggle('selected', li.dataset.key === key));

            if (key === 'channel') {
                itemListContainer.style.display = 'flex';
                renderItemList();
                postArea.classList.remove('active');
                channelSearch.style.display = 'inline-block';
                addChannelBtn.style.display = 'inline-block';
                deleteChannelBtn.style.display = 'inline-block';
                toggleItemListBtn.style.display = 'inline-block';
            } else {
                itemListContainer.style.display = 'none';
                itemList.innerHTML = '';
                postArea.classList.remove('active');
                selectedItem = null;
                channelSearch.style.display = 'none';
                addChannelBtn.style.display = 'none';
                deleteChannelBtn.style.display = 'none';
                toggleItemListBtn.style.display = 'none';
                timeline.innerHTML = '';
            }
        }

        function renderItemList(filter = '') {
            itemList.innerHTML = '';
            // フィルター済みのチャネル一覧を一旦変数に入れる
            const filteredChannels = channelItems
                .filter(item => item.toLowerCase().includes(filter.toLowerCase()))
                .filter(item => !showFavoritesOnly || favoriteChannels.has(item));

            // もし0件ならメッセージを表示して関数終了
            if (filteredChannels.length === 0) {
                const emptyMsg = document.createElement('div');
                emptyMsg.textContent = showFavoritesOnly
                    ? '🛈 お気に入りチャネルはまだありません。'
                    : '🛈 該当するチャネルはありません。';
                emptyMsg.style.color = '#555';
                emptyMsg.style.padding = '10px';
                itemList.appendChild(emptyMsg);
                return;
            }

            // 0件でなければボタンを作るループ開始
            filteredChannels.forEach(item => {
                const btn = document.createElement('button');
                btn.className = 'channel-btn';
                if (item === selectedItem) btn.classList.add('selected');

                btn.innerHTML = `
            <span>${item}</span>
            <span class="favorite-icon" data-name="${item}" style="margin-left: 8px; cursor: pointer;">
                ${favoriteChannels.has(item) ? '★' : '☆'}
            </span>
        `;

                btn.addEventListener('click', (e) => {
                    if (e.target.classList.contains('favorite-icon')) return;

                    selectedItem = item;
                    renderItemList();
                    postTitle.textContent = `${item} の投稿画面`;
                    postText.value = '';
                    postArea.classList.add('active');
                    renderPostsForSelectedChannel();
                });

                itemList.appendChild(btn);
            });

            deleteChannelBtn.disabled = !selectedItem || selectedItem === '全体' || selectedItem === 'クラス';
        }

        // ★クリックでお気に入り状態を切り替え
        itemList.addEventListener('click', (e) => {
            if (e.target.classList.contains('favorite-icon')) {
                const name = e.target.dataset.name;
                if (favoriteChannels.has(name)) {
                    favoriteChannels.delete(name);
                } else {
                    favoriteChannels.add(name);
                }
                renderItemList(channelSearch.value);
            }
        });

        // お気に入りフィルター切り替え
        const favoriteFilterBtn = document.getElementById('favoriteFilterBtn');
        favoriteFilterBtn.addEventListener('click', () => {
            showFavoritesOnly = !showFavoritesOnly;
            favoriteFilterBtn.textContent = showFavoritesOnly ? '☆ 全チャネル表示' : '★ お気に入りのみ表示';
            renderItemList(channelSearch.value);
        });

        toggleItemListBtn.addEventListener('click', () => {
            itemListContainer.style.display = itemListContainer.style.display === 'none' ? 'flex' : 'none';
        });

        sidebarItems.forEach(li => {
            li.addEventListener('click', () => {
                selectMainKey(li.dataset.key);
            });
        });

        addChannelBtn.addEventListener('click', () => {
            const name = prompt('新しいチャネル名を入力してください：');
            if (!name) return;
            if (channelItems.includes(name)) {
                alert('既に存在するチャネルです');
                return;
            }
            channelItems.push(name);
            postsData[name] = []; // 新チャネル用投稿配列も作成
            renderItemList();
        });

        deleteChannelBtn.addEventListener('click', () => {
            // if (!selectedItem || selectedItem === '全体') {
            //     alert('「全体」チャネルは削除できません');
            //     return;
            // }
            if (!selectedItem || selectedItem === '全体' || selectedItem === 'クラス') {
                alert(`「${selectedItem}」チャネルは削除できません`);
                return;
            }


            if (confirm(`「${selectedItem}」を削除しますか？`)) {
                channelItems = channelItems.filter(c => c !== selectedItem);
                delete postsData[selectedItem];
                selectedItem = null;
                postArea.classList.remove('active');
                renderItemList();
                timeline.innerHTML = '';
            }
        });


        postBtn.addEventListener('click', () => {
            if (!selectedItem) {
                alert('チャネルを選択してください');
                return;
            }
            const content = postText.value.trim();
            if (!content) {
                alert('投稿内容を入力してください');
                return;
            }

            // 投稿データ追加
            postsData[selectedItem].push({
                user: currentUser,
                text: content,
                timestamp: new Date(),
            });

            postText.value = '';
            renderPostsForSelectedChannel();
        });

        channelSearch.addEventListener('input', () => {
            renderItemList(channelSearch.value);
        });

        // 選択チャネルの投稿をtimelineに表示する
        function renderPostsForSelectedChannel() {
            timeline.innerHTML = '';
            if (!selectedItem || !postsData[selectedItem] || postsData[selectedItem].length === 0) {
                timeline.textContent = 'まだ投稿がありません。';
                return;
            }

            // 新しい投稿順で表示
            postsData[selectedItem]
                .slice()
                .sort((a, b) => b.timestamp - a.timestamp)
                .forEach(post => {
                    const postDiv = document.createElement('div');
                    postDiv.className = 'postItem';

                    const metaDiv = document.createElement('div');
                    metaDiv.className = 'meta';

                    // 時刻を見やすく表示（例：YYYY/MM/DD HH:mm）
                    const dt = post.timestamp;
                    const formattedTime = `${dt.getFullYear()}/${('0' + (dt.getMonth() + 1)).slice(-2)}/${('0' + dt.getDate()).slice(-2)} ${('0' + dt.getHours()).slice(-2)}:${('0' + dt.getMinutes()).slice(-2)}`;

                    metaDiv.innerHTML = `
                        <img src="${post.user.icon}" alt="アイコン" style="width:20px; height:20px; border-radius:50%; vertical-align:middle; margin-right:6px;">
                        <strong>${post.user.name}</strong> ／ ${formattedTime}
                    `;

                    const contentDiv = document.createElement('div');
                    contentDiv.className = 'content';
                    contentDiv.textContent = post.text;

                    postDiv.appendChild(metaDiv);
                    postDiv.appendChild(contentDiv);

                    timeline.appendChild(postDiv);
                });
        }

        // 初期設定
        selectMainKey('channel');
    </script>
</body>

</html>
