<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>チャネル管理＆投稿</title>
    <!-- CSSファイルのリンク -->
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New&display=swap" rel="stylesheet">
     <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>
    <div id="sidebar">
  <h2><i class="fas fa-bars"></i></h2>
        <ul>
            <li data-key="channel" class="selected">ホーム</li>
            <li data-key="follow">フォロー一覧</li>
            <li data-key="dm">DM</li>
            <li data-key="setting">設定</li>
            <li data-key="log out">ログアウト</li>
        </ul>
    </div>
    <div id="main">
        <div id="header">
            <div id="userInfo">
                <img id="userIcon" src="https://via.placeholder.com/40" alt="ユーザーアイコン" />
                <span id="userName">太郎さん</span>
            </div>
            <button id="toggleItemListBtn">チャネル一覧</button>
            <input type="text" id="channelSearch" placeholder="チャネル検索" />
        </div>
        <div id="itemListContainer">
            <div id="itemList"></div>
            <div id="itemControls">
                <button id="favoriteFilterBtn">★のみ表示</button>
                <button id="addChannelBtn">＋</button>
                <button id="deleteChannelBtn" disabled>🗑</button>
            </div>
        </div>
        <div id="postArea">
            <div id="timeline"></div>
            <h3 id="postTitle">投稿画面</h3>
            <textarea id="postText" placeholder="ここに投稿内容を入力"></textarea>
            <button id="postBtn">投稿</button>
        </div>
    </div>
    <!-- JavaScriptファイルのリンク -->
    <script src="script.js"></script>
</body>

</html>
