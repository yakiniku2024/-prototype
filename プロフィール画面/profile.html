<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>プロフィール編集</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
    <aside class="sidebar">
    <nav>
        <ul>
            <li><a href="#">ホーム</a></li>
            <li><a href="#">フォロー一覧</a></li>
            <li><a href="#">DM</a></li>
            <li><a href="#">設定</a></li>
            <li><a href="#">ログアウト</a></li>
        </ul>
    </nav>
    <div class="sidebar-icon">
        <div class="icon-circle">ア</div>
    </div>
    </aside>

    <main class="profile-area">
    <div class="profile-form">
        <div class="profile-icon">ア</div>

        <div class="form-group">
            <label for="username">ユーザ名</label>
            <input type="text" id="username" placeholder="ユーザ名を入力">
        </div>

        <div class="form-group">
            <label for="course">コース</label>
            <input type="text" id="course" placeholder="コースを入力">
        </div>

        <div class="form-group">
            <label for="bio">自己紹介</label>
            <textarea id="bio" rows="4" placeholder="自己紹介を入力"></textarea>
        </div>

        <div class="form-group right-align">
            <button type="submit">決定</button>
        </div>
    </div>
    </main>
</div>
</body>
</html>
